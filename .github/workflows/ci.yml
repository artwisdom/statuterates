name: verify-change

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# This workflow is deliberately validation-only. It never fetches upstream rate sources,
# commits, deploys, opens issues, or writes to a provider.
permissions:
  contents: read

concurrency:
  group: verify-change-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Test the pipeline and validate committed exports
        working-directory: pipeline
        # `build` hydrates an isolated in-memory database from data/exports. It does not fetch.
        run: |
          npm test
          node run.mjs build

      - name: Install and test the site
        working-directory: site
        run: |
          npm ci
          npm test

      - name: Test shared calculation code
        working-directory: shared
        run: node --test

      - name: Test machine safety controls and the source-review registry
        run: |
          node --test machine/*.test.mjs
          node machine/source-review-registry.mjs >/dev/null

      - name: Install and test the read-only MCP interface
        working-directory: machine/mcp-server
        run: |
          npm ci
          npm test

      - name: Generate the static API from committed exports
        run: node machine/build-api.mjs

      - name: Build the static site with the synthetic ad boundary and without deployment
        working-directory: site
        env:
          SITE_URL: https://statuterates.com
          # Fake public identifiers exercise the exact ad-eligible/ad-free rendering boundary without
          # contacting Google. Browser tests abort every cross-origin request.
          ADSENSE_CLIENT: ca-pub-0000000000000000
          ADSENSE_SLOT: "0000000000"
          DEPLOY_MARKER: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        run: npm run build

      - name: Verify built links and indexing guardrails
        working-directory: site
        env:
          SITE_URL: https://statuterates.com
        run: npm run verify-build

      - name: Install the pinned Chromium release-test browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser release journeys against the built artifact
        working-directory: site
        env:
          EXPECT_ADSENSE_CLIENT: ca-pub-0000000000000000
          EXPECT_ADSENSE_SLOT: "0000000000"
        run: npm run test:browser

      - name: Retain browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-release-failure-${{ github.run_id }}
          path: tmp/playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify generated API conformance
        run: node machine/check-api-conformance.mjs

      - name: Verify current documentation against generated artifacts
        run: node machine/check-doc-truth.mjs
