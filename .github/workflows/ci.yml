name: verify-change

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# This workflow is deliberately validation-only. It never fetches upstream rate sources,
# commits, deploys, opens issues, or writes to a provider.
permissions:
  contents: read

concurrency:
  group: verify-change-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Test the pipeline and validate committed exports
        working-directory: pipeline
        # `build` hydrates an isolated in-memory database from data/exports. It does not fetch.
        run: |
          npm test
          node run.mjs build

      - name: Install and test the site
        working-directory: site
        run: |
          npm ci
          npm test

      - name: Test shared calculation code
        working-directory: shared
        run: node --test

      - name: Test the production health checker
        run: node --test machine/check-site-health.test.mjs

      - name: Install and test the read-only MCP interface
        working-directory: machine/mcp-server
        run: |
          npm ci
          npm test

      - name: Generate the static API from committed exports
        run: node machine/build-api.mjs

      - name: Build the static site without ads or deployment
        working-directory: site
        env:
          SITE_URL: https://statuterates.com
          ADSENSE_CLIENT: ""
          ADSENSE_SLOT: ""
          DEPLOY_MARKER: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        run: npm run build

      - name: Verify built links and indexing guardrails
        working-directory: site
        env:
          SITE_URL: https://statuterates.com
        run: npm run verify-build

      - name: Verify generated API conformance
        run: node machine/check-api-conformance.mjs

      - name: Verify current documentation against generated artifacts
        run: node machine/check-doc-truth.mjs
