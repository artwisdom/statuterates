# ============================================================================================
# ACTIVE: deploys validated main-branch changes and follows every successful weekly refresh.
#
# The workflow_run trigger is intentional. GitHub suppresses push workflows caused by GITHUB_TOKEN,
# so a refresh commit cannot reliably trigger this workflow through `push` alone.
# ============================================================================================
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "data/exports/**"
      - "pipeline/**"
      - "shared/**"
      - "site/**"
      - "machine/build-api.mjs"
      - "machine/check-public-edge.mjs"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["refresh-data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run points at the triggering run's original SHA, before refresh-data pushes
          # its export commit. Production must always build the latest validated main branch.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Test and validate the exact committed export contract
        working-directory: pipeline
        run: |
          npm test
          node run.mjs build

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Run site data-contract tests
        working-directory: site
        run: npm test

      - name: Run shared calculation tests
        working-directory: shared
        run: node --test

      - name: Build the static JSON API from the committed exports
        # Regenerate site/public/api/ (git-ignored) from data/exports before building the site.
        run: node machine/build-api.mjs

      - name: Build the site
        working-directory: site
        env:
          # The owner sets their real domain here (repository variable). Falls back to the Pages URL.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          # One-switch ads: set repo variable ADSENSE_CLIENT=ca-pub-XXXX after AdSense approval.
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || '' }}
          # Optional: set ADSENSE_SLOT to a "Display/responsive" ad-unit id to render intentional,
          # labeled in-content ad units (top/bottom of each page). Empty = rely on Auto Ads only.
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT || '' }}
        run: npm run build

      - name: Verify built links and indexing guardrails
        working-directory: site
        run: npm run verify-build

      - name: Apply base path for GitHub Pages project subpath
        working-directory: site
        # No-op at a domain root. For a project site (github.io/<repo>) it rewrites internal links to
        # the /<repo>/ subpath. If a custom domain is set (vars.SITE_URL), BASE_PATH defaults to '/'.
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || (vars.SITE_URL && '/' || format('/{0}', github.event.repository.name)) }}
        run: node scripts/fix-base.mjs

      - name: Verify API conformance (fail the deploy if the API drifted)
        run: node machine/check-api-conformance.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Verify the public edge after deployment
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node machine/check-public-edge.mjs

      # Notify IndexNow only after production is live, so every submitted URL resolves to the new
      # artifact. Google does not use IndexNow; the sitemap remains its discovery mechanism.
      - name: Ping IndexNow
        if: ${{ vars.SITE_URL != '' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          KEY=78e1a4c8dd592144913ffc2f8f1b9478
          HOST=$(printf '%s' "$SITE_URL" | sed -E 's#https?://##; s#/.*$##')
          SITEMAP=$(mktemp)
          curl -fsSL --retry 3 --retry-delay 2 \
            "${SITE_URL%/}/sitemap.xml?deploy=${{ github.run_id }}" -o "$SITEMAP"
          grep -oE '<loc>[^<]+</loc>' "$SITEMAP" | sed -E 's#</?loc>##g' | head -10000 \
            | jq -R . | jq -s "{host: \"$HOST\", key: \"$KEY\", keyLocation: \"https://$HOST/$KEY.txt\", urlList: .}" > indexnow.json
          echo "Submitting $(jq '.urlList | length' indexnow.json) live URLs to IndexNow for $HOST"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json -w "IndexNow HTTP %{http_code}\n" -o /dev/null \
            || echo "IndexNow ping failed (non-fatal)"

# --------------------------------------------------------------------------------------------
# ALTERNATIVE: Cloudflare Pages (better for pay-per-crawl + edge performance). To use instead of
# GitHub Pages, disable the `deploy` job above and use Cloudflare's Git integration, or:
#
#   - name: Publish to Cloudflare Pages
#     uses: cloudflare/pages-action@v1
#     with:
#       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # owner adds this secret
#       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # owner adds this secret
#       projectName: statuterates
#       directory: site/dist
# --------------------------------------------------------------------------------------------
