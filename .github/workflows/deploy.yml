# ============================================================================================
# ACTIVE: deploys validated main-branch changes and follows every successful weekly refresh.
#
# The workflow_run trigger is intentional. GitHub suppresses push workflows caused by GITHUB_TOKEN,
# so a refresh commit cannot reliably trigger this workflow through `push` alone.
# ============================================================================================
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "data/exports/**"
      - "pipeline/**"
      - "shared/**"
      - "site/**"
      - "machine/**"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["refresh-data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site
  # A newer push must not interrupt an artifact upload, Pages publication, or public-edge check.
  # Every queued run resolves the then-current main checkout and records the exact SHA it built.
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      deploy_marker: ${{ steps.release.outputs.deploy_marker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # workflow_run points at the triggering run's original SHA, before refresh-data pushes
          # its export commit. Production must always build the latest validated main branch.
          ref: main

      - name: Require the production target and record the exact checked-out source
        id: release
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          set -euo pipefail
          if [ -n "$CONFIGURED_SITE_URL" ] && [ "$CONFIGURED_SITE_URL" != "https://statuterates.com" ]; then
            echo "Refusing to build with unexpected SITE_URL repository variable: $CONFIGURED_SITE_URL" >&2
            exit 1
          fi
          if [ -n "$CONFIGURED_BASE_PATH" ] && [ "$CONFIGURED_BASE_PATH" != "/" ]; then
            echo "Refusing to build with unexpected BASE_PATH repository variable: $CONFIGURED_BASE_PATH" >&2
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the exact checked-out commit." >&2
            exit 1
          fi
          DEPLOY_MARKER="statuterates:${SOURCE_SHA}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy_marker=$DEPLOY_MARKER" >> "$GITHUB_OUTPUT"
          echo "Building exact source $SOURCE_SHA with marker $DEPLOY_MARKER"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install machine-contract dependencies
        working-directory: machine
        run: npm ci

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Test and validate the exact committed export contract
        working-directory: pipeline
        run: |
          npm test
          node run.mjs build

      - name: Test machine safety controls and validate the source-review registry
        working-directory: machine
        run: |
          npm test
          node source-review-registry.mjs >/dev/null

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Run site data-contract tests
        working-directory: site
        run: npm test

      - name: Run shared calculation tests
        working-directory: shared
        run: node --test

      - name: Install and test the read-only MCP interface
        working-directory: machine/mcp-server
        run: |
          npm ci
          npm test

      - name: Build the static JSON API from the committed exports
        # Regenerate site/public/api/ (git-ignored) from data/exports before building the site.
        run: node machine/build-api.mjs

      - name: Build the site
        working-directory: site
        env:
          SITE_URL: https://statuterates.com
          # Account-level switch: ADSENSE_CLIENT enables ads only on the source-controlled page
          # allowlist. Error, noindex, legal, navigation, state-hub, and shallow pages stay ad-free.
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || '' }}
          # Optional: set ADSENSE_SLOT to a "Display/responsive" ad-unit id to render intentional,
          # labeled in-content ad units (top/bottom of each page). Empty = rely on Auto Ads only.
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT || '' }}
          # Exact artifact identity for the public-edge deployment check.
          DEPLOY_MARKER: ${{ steps.release.outputs.deploy_marker }}
        run: npm run build

      - name: Verify built links and indexing guardrails
        working-directory: site
        run: npm run verify-build

      - name: Install the pinned Chromium release-test browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser release journeys against the built artifact
        working-directory: site
        env:
          EXPECT_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || '' }}
          EXPECT_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT || '' }}
        run: npm run test:browser

      - name: Retain browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-release-failure-${{ github.run_id }}
          path: tmp/playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Apply base path for GitHub Pages project subpath
        working-directory: site
        # Production is permanently served at the custom-domain root. The earlier configuration
        # guard rejects any provider variable that would change either value.
        env:
          SITE_URL: https://statuterates.com
          BASE_PATH: "/"
        run: node scripts/fix-base.mjs

      - name: Verify API conformance (fail the deploy if the API drifted)
        run: node machine/check-api-conformance.mjs

      - name: Verify current documentation against generated artifacts
        run: node machine/check-doc-truth.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
          # Retain several weekly known-good artifacts for manual recovery without executing an
          # older dependency tree. The recovery workflow still requires a successful run receipt.
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download this run's retained Pages artifact for recovery validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/release-artifact

      - name: Prove the retained artifact is recovery-eligible before publication
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node machine/validate-recovery-artifact.mjs "$RUNNER_TEMP/release-artifact/artifact.tar"

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify the public edge after deployment
        env:
          SITE_URL: https://statuterates.com
          DEPLOY_MARKER: ${{ needs.build.outputs.deploy_marker }}
        run: node machine/check-public-edge.mjs

      # Notify IndexNow only after production is live, so every submitted URL resolves to the new
      # artifact. Google does not use IndexNow; the sitemap remains its discovery mechanism.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://statuterates.com
        run: |
          KEY=133250e3ec585df4147c25515d87c5e1
          HOST=$(printf '%s' "$SITE_URL" | sed -E 's#https?://##; s#/.*$##')
          SITEMAP=$(mktemp)
          curl -fsSL --retry 3 --retry-delay 2 \
            "${SITE_URL%/}/sitemap.xml?deploy=${{ github.run_id }}" -o "$SITEMAP"
          grep -oE '<loc>[^<]+</loc>' "$SITEMAP" | sed -E 's#</?loc>##g' | head -10000 \
            | jq -R . | jq -s "{host: \"$HOST\", key: \"$KEY\", keyLocation: \"https://$HOST/$KEY.txt\", urlList: .}" > indexnow.json
          echo "Submitting $(jq '.urlList | length' indexnow.json) live URLs to IndexNow for $HOST"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json -w "IndexNow HTTP %{http_code}\n" -o /dev/null \
            || echo "IndexNow ping failed (non-fatal)"

  deploy-alert:
    name: Maintain the deployment failure alert
    needs: [build, deploy]
    if: ${{ always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_TITLE: "[automation] StatuteRates deployment needs attention"
      ALERT_LABEL: "automation:deploy-failure"
      ALERT_ASSIGNEE: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_EVENT: ${{ github.event_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Open or update one deployment failure alert
        if: ${{ needs.build.result != 'success' || needs.deploy.result != 'success' }}
        continue-on-error: true
        run: |
          gh label create "$ALERT_LABEL" \
            --color "B60205" \
            --description "A validated StatuteRates production deployment failed" \
            --force

          BODY=$(printf '%s\n' \
            "The StatuteRates build, Pages publication, or public-edge verification did not complete successfully." \
            "" \
            "- Latest failed run: [Open the GitHub Actions run]($RUN_URL)" \
            "- Build result: \`$BUILD_RESULT\`" \
            "- Deploy/public verification result: \`$DEPLOY_RESULT\`" \
            "- Exact checked-out source: \`${SOURCE_SHA:-unavailable}\`" \
            "- Trigger: \`$RUN_EVENT\`" \
            "" \
            "A pre-publication failure leaves the last good site intact. A post-publication verification failure may require the manual recovery workflow; never bypass its artifact and confirmation checks.")

          ISSUE_NUMBER=$(gh issue list \
            --state all \
            --label "$ALERT_LABEL" \
            --limit 100 \
            --json number \
            --jq 'map(.number) | max // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')
            if [ "$ISSUE_STATE" = "CLOSED" ]; then
              gh issue reopen "$ISSUE_NUMBER"
            fi
            gh issue edit "$ISSUE_NUMBER" \
              --title "$ALERT_TITLE" \
              --body "$BODY" \
              --add-label "$ALERT_LABEL" \
              --add-assignee "$ALERT_ASSIGNEE"
            gh issue comment "$ISSUE_NUMBER" --body "The deployment failed again: $RUN_URL"
          else
            gh issue create \
              --title "$ALERT_TITLE" \
              --body "$BODY" \
              --label "$ALERT_LABEL" \
              --assignee "$ALERT_ASSIGNEE"
          fi

          OPEN_ISSUES=$(gh issue list \
            --state open \
            --label "$ALERT_LABEL" \
            --limit 100 \
            --json number \
            --jq 'map(.number) | sort | reverse | .[]')
          PRIMARY_ISSUE=$(printf '%s\n' "$OPEN_ISSUES" | head -n 1)
          for DUPLICATE in $OPEN_ISSUES; do
            if [ "$DUPLICATE" != "$PRIMARY_ISSUE" ]; then
              gh issue close "$DUPLICATE" --comment "Closed as a duplicate of #$PRIMARY_ISSUE."
            fi
          done

      - name: Close recovered deployment failure alerts
        if: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' }}
        continue-on-error: true
        run: |
          gh label create "$ALERT_LABEL" \
            --color "B60205" \
            --description "A validated StatuteRates production deployment failed" \
            --force

          ISSUE_NUMBERS=$(gh issue list \
            --state open \
            --label "$ALERT_LABEL" \
            --limit 100 \
            --json number \
            --jq '.[].number')

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No open deployment-failure alert needs to be closed."
          else
            for ISSUE_NUMBER in $ISSUE_NUMBERS; do
              gh issue close "$ISSUE_NUMBER" \
                --comment "The production deployment and public-edge verification recovered successfully: $RUN_URL"
            done
          fi

# --------------------------------------------------------------------------------------------
# ALTERNATIVE: Cloudflare Pages (better for pay-per-crawl + edge performance). To use instead of
# GitHub Pages, disable the `deploy` job above and use Cloudflare's Git integration, or:
#
#   - name: Publish to Cloudflare Pages
#     uses: cloudflare/pages-action@v1
#     with:
#       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # owner adds this secret
#       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # owner adds this secret
#       projectName: statuterates
#       directory: site/dist
# --------------------------------------------------------------------------------------------
