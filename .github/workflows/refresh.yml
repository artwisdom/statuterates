# ============================================================================================
# ACTIVE: refreshes official sources every Monday evening (U.S. Eastern) and commits validated
# exports to main.
#
# Estimated usage: weekly run × ~3 min = ~13 min/month (GitHub free tier is 2,000 min/month).
# ============================================================================================
name: refresh-data

on:
  schedule:
    # Tuesday 02:00 UTC is Monday 22:00 EDT / 21:00 EST, after the Federal Reserve's weekly H.15
    # publication window. DGS1 may already contain a partial newer week, but only WGS1YR-backed
    # weeks can be exported.
    - cron: "0 2 * * 2"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # to commit refreshed data/exports back to the repo
  issues: write # maintain deduplicated refresh-failure and calculator legal-review issues

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Run pipeline tests
        working-directory: pipeline
        run: npm test

      - name: Run pipeline (fetch → validate → export)
        id: pipeline
        working-directory: pipeline
        # `node run.mjs all` FAILS LOUD: a validation error exits non-zero and does NOT export,
        # so broken/stale data can never be committed or deployed.
        run: node run.mjs all

      - name: Verify refreshed exports before commit
        working-directory: pipeline
        # Tests run once before network fetches to protect the fetch itself, then again against the
        # newly generated snapshot. This prevents a valid new quarter/week from exposing a stale
        # fixture only after the bot has already committed it.
        run: |
          npm test
          node run.mjs build

      - name: Commit refreshed data (only if exports changed)
        id: commit
        if: success()
        run: |
          git config user.name "statuterates-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/exports)" ]; then
            git add data/exports
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deployment handoff
        if: success()
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Validated exports changed and were pushed. deploy-site will run after this workflow completes."
          else
            echo "No export changes. deploy-site will still verify production from main after this workflow completes."
          fi

      - name: Check calculator legal-review windows
        id: legal-review
        if: success()
        run: node machine/legal-review-reminder.mjs

      - name: Open calculator legal-review reminder
        if: success() && steps.legal-review.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TITLE: ${{ steps.legal-review.outputs.title }}
          REVIEW_BODY: ${{ steps.legal-review.outputs.body }}
        run: |
          OPEN_COUNT=$(gh issue list --state open --search "$REVIEW_TITLE in:title" --json number --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --title "$REVIEW_TITLE" --body "$REVIEW_BODY"
          else
            echo "An open legal-review reminder already exists."
          fi

      # ---- Self-healing / diagnostics ----------------------------------------------------------
      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "## ❌ Data refresh failed"
            echo ""
            echo "The fetch, validation, export recheck, or test suite exited non-zero. A source may"
            echo "have changed/blocked requests, or a test may need to follow a valid new period."
            echo "Unvalidated exports cannot be committed or deployed (fail-loud by design)."
            echo "A later auxiliary failure also prevents the refresh-triggered deployment."
            echo ""
            echo "**Next steps** (see docs/MAINTENANCE_RUNBOOK.md):"
            echo "1. Open the failed step above and find the source, validation, or test error."
            echo "2. If a source layout changed, update its fetcher in \`pipeline/fetchers/\`."
            echo "3. If a valid new period exposed a stale fixture, make that test data-relative."
            echo "4. If a source is temporarily down/rate-limiting, re-run this workflow."
            echo "5. Re-run \`npm test\`, \`node run.mjs all\`, and \`node run.mjs build\` locally."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update refresh failure alert
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_TITLE: "[automation] StatuteRates data refresh needs attention"
          ALERT_LABEL: "automation:refresh-data-failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          gh label create "$ALERT_LABEL" \
            --color "B60205" \
            --description "The validated StatuteRates data refresh failed" \
            --force

          BODY=$(printf '%s\n' \
            "The scheduled or manually triggered StatuteRates refresh workflow did not complete successfully." \
            "" \
            "- Latest failed run: [Open the GitHub Actions run]($RUN_URL)" \
            "- Trigger: \`$RUN_EVENT\`" \
            "- Ref: \`$RUN_REF\`" \
            "- Commit: \`$RUN_SHA\`" \
            "" \
            "The workflow's data gates fail closed, so unvalidated exports cannot be committed or deployed. Review the Actions run for diagnostics. This issue intentionally contains no fetched data, credentials, or log excerpts.")

          ISSUE_NUMBER=$(gh issue list \
            --state all \
            --label "$ALERT_LABEL" \
            --limit 100 \
            --json number \
            --jq 'map(.number) | max // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')
            if [ "$ISSUE_STATE" = "CLOSED" ]; then
              gh issue reopen "$ISSUE_NUMBER"
            fi
            gh issue edit "$ISSUE_NUMBER" \
              --title "$ALERT_TITLE" \
              --body "$BODY" \
              --add-label "$ALERT_LABEL"
            gh issue comment "$ISSUE_NUMBER" --body "The refresh failed again: $RUN_URL"
          else
            gh issue create \
              --title "$ALERT_TITLE" \
              --body "$BODY" \
              --label "$ALERT_LABEL"
          fi

      - name: Close recovered refresh failure alert
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_LABEL: "automation:refresh-data-failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ALERT_LABEL" \
            --color "B60205" \
            --description "The validated StatuteRates data refresh failed" \
            --force

          ISSUE_NUMBERS=$(gh issue list \
            --state open \
            --label "$ALERT_LABEL" \
            --limit 100 \
            --json number \
            --jq '.[].number')

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No open refresh-failure alert needs to be closed."
          else
            for ISSUE_NUMBER in $ISSUE_NUMBERS; do
              gh issue close "$ISSUE_NUMBER" \
                --comment "The validated data refresh recovered successfully: $RUN_URL"
            done
          fi
