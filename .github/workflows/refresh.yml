# ============================================================================================
# ACTIVE: refreshes official sources every Monday evening (U.S. Eastern) and commits validated
# exports to main.
#
# Estimated usage: weekly run × ~3 min = ~13 min/month (GitHub free tier is 2,000 min/month).
# ============================================================================================
name: refresh-data

on:
  schedule:
    # Tuesday 02:00 UTC is Monday 22:00 EDT / 21:00 EST, after the Federal Reserve's weekly H.15
    # publication window. DGS1 may already contain a partial newer week, but only WGS1YR-backed
    # weeks can be exported.
    - cron: "0 2 * * 2"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # to commit refreshed data/exports back to the repo
  issues: write # open one deduplicated reminder before a calculator's legal-review gate expires

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Run pipeline tests
        working-directory: pipeline
        run: npm test

      - name: Run pipeline (fetch → validate → export)
        id: pipeline
        working-directory: pipeline
        # `node run.mjs all` FAILS LOUD: a validation error exits non-zero and does NOT export,
        # so broken/stale data can never be committed or deployed.
        run: node run.mjs all

      - name: Commit refreshed data (only if exports changed)
        id: commit
        if: success()
        run: |
          git config user.name "statuterates-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/exports)" ]; then
            git add data/exports
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Self-healing / diagnostics ----------------------------------------------------------
      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "## ❌ Data refresh failed"
            echo ""
            echo "The pipeline exited non-zero. Most likely a source changed its HTML/CSV layout or is"
            echo "temporarily blocking requests. NO data was committed or deployed (fail-loud by design)."
            echo ""
            echo "**Next steps** (see docs/MAINTENANCE_RUNBOOK.md):"
            echo "1. Open the 'Run pipeline' step log above and find the failing source id + error."
            echo "2. If a source layout changed, update its fetcher in \`pipeline/fetchers/\`."
            echo "3. If a source is temporarily down/rate-limiting, just re-run this workflow."
            echo "4. Re-run \`npm test\` and \`node run.mjs all\` locally before pushing the fix."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment handoff
        if: success()
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Validated exports changed and were pushed. deploy-site will run after this workflow completes."
          else
            echo "No export changes. deploy-site will still verify production from main after this workflow completes."
          fi

      - name: Check calculator legal-review windows
        id: legal-review
        if: success()
        run: node machine/legal-review-reminder.mjs

      - name: Open calculator legal-review reminder
        if: success() && steps.legal-review.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TITLE: ${{ steps.legal-review.outputs.title }}
          REVIEW_BODY: ${{ steps.legal-review.outputs.body }}
        run: |
          OPEN_COUNT=$(gh issue list --state open --search "$REVIEW_TITLE in:title" --json number --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --title "$REVIEW_TITLE" --body "$REVIEW_BODY"
          else
            echo "An open legal-review reminder already exists."
          fi
